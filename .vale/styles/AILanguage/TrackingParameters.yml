# Adapted from ammil-industries/vale-signs-of-ai-writing (CC BY-SA 4.0). See README.md.
# A link pasted straight out of a chat window carries its source with it.
# Needs `scope: raw`: Vale's markdown parser drops URLs before the prose scopes
# ever see them.
extends: existence
message: "Don't leave chat-tool tracking parameters in links ('%s'). A URL pasted from a chat window carries its source tag; strip the parameter."
level: error
scope: raw
nonword: true
link: https://en.wikipedia.org/wiki/Wikipedia:Signs_of_AI_writing
tokens:
  - 'utm_source=chatgpt\.com'
  - 'utm_source=(?:openai|perplexity|copilot|claude)'
  - '[?&]ref=chatgpt'
